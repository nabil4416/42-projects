[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Constrained decoding for LLM function calling"
requires-python = ">=3.10"
dependencies = [
    "llm-sdk",
    "numpy>=1.26",
    "pydantic>=2.7",
    "torch>=2.0",
]

[tool.uv.sources]
llm-sdk = { path = "llm_sdk" }
torch = { index = "pytorch-cpu" }

[dependency-groups]
dev = [
    "flake8>=7.0",
    "mypy>=1.10",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true
exclude = [
    "^llm_sdk/",
    "^\\.venv/",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
